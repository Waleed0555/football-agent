<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PitchIQ — Sign Up</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0a; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
  .navbar { background: #1a1a2e; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #333; height: 56px; }
  .navbar h1 { color: #4ade80; font-size: 1.2rem; }
  .nav-links { display: flex; gap: 8px; }
  .nav-link { color: #aaa; text-decoration: none; padding: 6px 16px; border: 1px solid #333; border-radius: 20px; font-size: 0.82rem; transition: all 0.2s; }
  .nav-link:hover { border-color: #4ade80; color: #4ade80; }
  .nav-link.active { background: #4ade80; color: #000; border-color: #4ade80; font-weight: bold; }
  .container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
  .card { background: #16213e; border: 1px solid #0f3460; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; }
  .card h2 { color: #4ade80; font-size: 1.4rem; margin-bottom: 6px; text-align: center; }
  .card p { color: #aaa; font-size: 0.82rem; text-align: center; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; color: #aaa; font-size: 0.78rem; margin-bottom: 6px; }
  .form-group input { width: 100%; background: #1e1e2e; border: 1px solid #333; border-radius: 8px; padding: 11px 14px; color: #fff; font-size: 0.88rem; outline: none; transition: border-color 0.2s; }
  .form-group input:focus { border-color: #4ade80; }
  .submit-btn { width: 100%; background: linear-gradient(135deg, #4ade80, #22c55e); color: #000; border: none; border-radius: 8px; padding: 12px; font-size: 0.95rem; font-weight: bold; cursor: pointer; margin-top: 8px; transition: transform 0.15s; }
  .submit-btn:hover { transform: scale(1.02); }
  .bottom-link { text-align: center; margin-top: 20px; color: #aaa; font-size: 0.8rem; }
  .bottom-link a { color: #4ade80; text-decoration: none; }
  .bottom-link a:hover { text-decoration: underline; }
  .error { background: #3a1a1a; border: 1px solid #f44336; border-radius: 8px; padding: 10px 14px; color: #ef9a9a; font-size: 0.8rem; margin-bottom: 16px; display: none; }
  .error.show { display: block; }
  .success { background: #1a3a1a; border: 1px solid #4ade80; border-radius: 8px; padding: 10px 14px; color: #a5d6a7; font-size: 0.8rem; margin-bottom: 16px; display: none; }
  .success.show { display: block; }
  .perks { background: #0f3460; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
  .perks p { color: #93c5fd; font-size: 0.78rem; margin-bottom: 4px; text-align: left; }
  .pitch-icon { text-align: center; font-size: 2.5rem; margin-bottom: 16px; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; }
  .divider hr { flex: 1; border: none; border-top: 1px solid #333; }
  .divider span { color: #555; font-size: 0.75rem; }
</style>
</head>
<body>
<div class="navbar">
  <h1>⚽ PitchIQ</h1>
  <div class="nav-links">
    <a href="/" class="nav-link">💬 Chat</a>
    <a href="/login" class="nav-link">Login</a>
    <a href="/signup" class="nav-link active">Sign Up</a>
  </div>
</div>
<div class="container">
  <div class="card">
    <div class="pitch-icon">🏆</div>
    <h2>Create Account</h2>
    <p>Join PitchIQ and unlock more questions</p>
    <div class="perks">
      <p>✅ 20 free questions per day (vs 10 without account)</p>
      <p>✅ Access to Tournament Mode</p>
      <p>✅ More features coming soon</p>
    </div>
    <div class="error" id="errorMsg"></div>
    <div class="success" id="successMsg"></div>
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Your name" />
    </div>
    <div class="form-group">
      <label>Email Address</label>
      <input type="email" id="email" placeholder="your@email.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="Choose a password" />
    </div>
    <div class="form-group">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Repeat your password" />
    </div>
    <button class="submit-btn" onclick="handleSignup()">Create Account</button>
    <div class="divider"><hr><span>or</span><hr></div>
    <div class="bottom-link">
      Already have an account? <a href="/login">Log in</a>
    </div>
  </div>
</div>
<script>
async function handleSignup() {
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const errorMsg = document.getElementById("errorMsg");
  const successMsg = document.getElementById("successMsg");
  errorMsg.classList.remove("show");
  successMsg.classList.remove("show");
  if (!name || !email || !password || !confirmPassword) {
    errorMsg.textContent = "Please fill in all fields.";
    errorMsg.classList.add("show");
    return;
  }
  if (password !== confirmPassword) {
    errorMsg.textContent = "Passwords do not match.";
    errorMsg.classList.add("show");
    return;
  }
  if (password.length < 6) {
    errorMsg.textContent = "Password must be at least 6 characters.";
    errorMsg.classList.add("show");
    return;
  }
  try {
    const res = await fetch("/api/signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, password })
    });
    const data = await res.json();
    if (data.success) {
      successMsg.textContent = "Account created! Redirecting...";
      successMsg.classList.add("show");
      setTimeout(() => window.location.href = "/", 1000);
    } else {
      errorMsg.textContent = data.message || "Something went wrong.";
      errorMsg.classList.add("show");
    }
  } catch(e) {
    errorMsg.textContent = "Something went wrong. Please try again.";
    errorMsg.classList.add("show");
  }
}
</script>
</body>
</html>
